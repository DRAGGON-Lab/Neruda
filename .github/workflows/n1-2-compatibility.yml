name: N1.2 Linux compatibility investigation

on:
  pull_request:
    paths:
      - 'experiments/n1_2/*.py'
      - 'experiments/n1_2/article/**'
      - 'experiments/n1_2/slides/**'
      - '.github/workflows/n1-2-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s experiments/n1_2 -p 'test_*.py' -v
  linux-x86_64:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record runner image
        run: |
          printf 'Runner image: %s / %s\n' "$ImageOS" "$ImageVersion"
          uname -a
          getconf GNU_LIBC_VERSION
          python3 --version
      - name: Run behavioral regression tests
        run: python3 -m unittest discover -s experiments/n1_2 -p 'test_*.py' -v
      - name: Provision pinned tools and attempt cache matrix
        run: python3 experiments/n1_2/linux_ci.py --root .tools/n1_2/linux-ci
      - name: Preserve sanitized evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: n1-2-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tools/n1_2/linux-ci/public/
          if-no-files-found: warn
          retention-days: 30
